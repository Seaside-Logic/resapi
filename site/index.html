    <script>
      // Set the theme before first paint to avoid a flash. Storage can be blocked; fall back to the OS setting.
      let stored = null
      try {
        stored = localStorage.getItem('theme')
      } catch {}
      document.documentElement.dataset.theme =
        stored ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    </script>
