name: Release

# Publishes to npm when a version tag (v0.1.0, v0.2.0-rc.1, ...) is pushed. Nothing else triggers it.
# Authentication is npm trusted publishing (OIDC): no npm token is stored in GitHub. Configure the
# trusted publisher for each package on npmjs.com with this repository and the file name release.yml.
# See docs/release-process.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Add a required reviewer to this environment in the repository settings to gate every release.
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.21.0
      - run: npm ci
      - run: npm run release:check
      - name: Check the tag matches every package version
        run: |
          for pkg in core sury hono express; do
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "@resapi/$pkg is $version, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
      # Dependency order: the adapters depend on core. Each publish must succeed before the next starts.
      # A version already on npm is skipped, so a release that failed partway can be finished by rerunning
      # this workflow. Releases go to the `next` tag; promote them to `latest` by hand (docs/release-process.md).
      - name: Publish
        run: |
          version=${GITHUB_REF_NAME#v}
          for pkg in core sury hono express; do
            if npm view "@resapi/$pkg@$version" version >/dev/null 2>&1; then
              echo "@resapi/$pkg@$version is already published, skipping"
              continue
            fi
            npm publish --workspace="@resapi/$pkg" --access public --tag next --provenance
          done
